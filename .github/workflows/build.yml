name: Build APK Motion X (Debug)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Kode
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependensi
        run: |
          cd motionx
          flutter pub get

      - name: Rakit APK Debug
        run: |
          cd motionx
          flutter build apk --debug

      - name: Tangkap APK ke Artifacts (Langsung Download dari GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: MotionX-APK
          path: motionx/build/app/outputs/flutter-apk/app-debug.apk
